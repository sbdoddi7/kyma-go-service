name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      # Build Go app
      - name: Build
        run: go build ./cmd/server

      # Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Generate image tag (commit SHA)
      - name: Set Image Tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Build & Push Docker Image
      - name: Build and Push Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/kyma-go-service:${{ env.TAG }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/kyma-go-service:${{ env.TAG }}

      # Setup kubectl
      - name: Set Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      # Setup Helm
      - name: Setup Helm
        uses: azure/setup-helm@v4

      # Deploy using Helm
      - name: Deploy to Kyma
        run: |
          helm upgrade --install kyma-go-service ./deployments/helm/kyma-go-service \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/kyma-go-service \
            --set image.tag=${{ env.TAG }}